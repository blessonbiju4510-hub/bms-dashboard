<!DOCTYPE html>
<html>
<head>
  <title>BMS Monitor — Blesson</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
      color: #58a6ff;
    }

    .status-bar {
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .dot {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      display: inline-block;
      background: grey;
      margin-right: 6px;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 30px 20px;
      width: 180px;
      text-align: center;
    }

    .card p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .value {
      font-size: 48px;
      font-weight: bold;
      color: #00ff88;
    }

    .unit {
      font-size: 16px;
      color: #8b949e;
    }

    .soc-bar-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 20px 30px;
      max-width: 580px;
      margin: 0 auto 30px auto;
    }

    .soc-bar-container p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .soc-bar {
      background: #30363d;
      border-radius: 8px;
      height: 24px;
      width: 100%;
      overflow: hidden;
    }

    .soc-fill {
      height: 100%;
      width: 0%;
      background: #00ff88;
      border-radius: 8px;
      transition: width 0.5s ease, background 0.5s ease;
    }

    .alert-box {
      display: none;
      background: #ff000022;
      border: 2px solid red;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: red;
      max-width: 580px;
      margin: 0 auto;
    }

    .log {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px;
      max-width: 580px;
      margin: 20px auto 0 auto;
      font-size: 12px;
      color: #8b949e;
      height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>⚡ Battery Cell Monitor</h1>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span id="status">Connecting to broker...</span>
  </div>

  <div class="cards">
    <div class="card">
      <p>Voltage</p>
      <span class="value" id="volt">--</span>
      <span class="unit">V</span>
    </div>
    <div class="card">
      <p>Temperature</p>
      <span class="value" id="temp">--</span>
      <span class="unit">°C</span>
    </div>
    <div class="card">
      <p>State of Charge</p>
      <span class="value" id="soc">--</span>
      <span class="unit">%</span>
    </div>
  </div>

  <div class="soc-bar-container">
    <p>Battery Level</p>
    <div class="soc-bar">
      <div class="soc-fill" id="socFill"></div>
    </div>
  </div>

  <div class="alert-box" id="alertBox"></div>

  <div class="log" id="log"></div>

  <script>
    var client = new Paho.MQTT.Client(
      "broker.hivemq.com", 8884,
      "dashboard_" + Math.random().toString(16).substr(2, 8)
    );

    function addLog(msg) {
      var log = document.getElementById("log");
      var time = new Date().toLocaleTimeString();
      log.innerHTML = "[" + time + "] " + msg + "<br>" + log.innerHTML;
    }

    client.onConnectionLost = function(e) {
      document.getElementById("dot").style.background = "red";
      document.getElementById("status").innerText = "Disconnected";
      addLog("Connection lost: " + e.errorMessage);
    };

    client.onMessageArrived = function(message) {
      var topic = message.destinationName;
      var data  = JSON.parse(message.payloadString);

      if (topic === "bms/blesson/data") {
        var v   = parseFloat(data.voltage);
        var t   = parseFloat(data.temperature);
        var s   = parseFloat(data.soc);

        document.getElementById("volt").innerText = v.toFixed(2);
        document.getElementById("temp").innerText = t.toFixed(1);
        document.getElementById("soc").innerText  = Math.round(s);

        // Update SoC bar colour based on level
        var fill = document.getElementById("socFill");
        fill.style.width = Math.round(s) + "%";
        if (s > 60)      fill.style.background = "#00ff88"; // green
        else if (s > 30) fill.style.background = "#ffa500"; // orange
        else             fill.style.background = "#ff4444"; // red

        // Clear alert if back to normal
        document.getElementById("alertBox").style.display = "none";

        addLog("Data: " + v.toFixed(2) + "V | " + t.toFixed(1) + "°C | " + Math.round(s) + "%");
      }

      if (topic === "bms/blesson/alert") {
        var alertBox = document.getElementById("alertBox");
        alertBox.style.display = "block";
        alertBox.innerText = "⚠ ALERT: " + data.type;
        addLog("ALERT received: " + data.type);
      }
    };

    client.connect({
      useSSL: true,
      onSuccess: function() {
        document.getElementById("dot").style.background = "#00ff88";
        document.getElementById("status").innerText = "Connected to HiveMQ";
        client.subscribe("bms/blesson/data");
        client.subscribe("bms/blesson/alert");
        addLog("Subscribed to bms/blesson/data and bms/blesson/alert");
      },
      onFailure: function(e) {
        document.getElementById("dot").style.background = "red";
        document.getElementById("status").innerText = "Connection failed";
        addLog("Failed: " + e.errorMessage);
      }
    });
  </script>

</body>
</html>
